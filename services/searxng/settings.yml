# =============================================================================
# Atlas — SearXNG settings (PHASE 18: fine-tuning)
# =============================================================================
# This is the canonical copy of Atlas' SearXNG instance config, kept in the repo
# so the tuning is reviewable and reproducible.
#
#   Live file  : ~/searxng/searxng/settings.yml  (bind-mounted at /etc/searxng)
#   Apply with : the command in services/searxng/README.md
#
# Everything below was verified against the running container (SearXNG
# 2026.9.25+d8ae3abd5) rather than written from memory. PHASE 18 asked for six
# things; here is which are real settings and which are not:
#
#   safe_search 0 .............. applied (already the default; pinned on purpose)
#   google/bing/duckduckgo/
#   brave/wikipedia/arxiv/
#   semantic scholar/yahoo ..... applied. google, bing AND yahoo are
#                                `disabled: true` in this build's defaults, so
#                                enabling them is a genuine change. Caveat: it
#                                only affects searches that do not pass
#                                `engines=` — with an explicit engine list
#                                SearXNG honours it even for disabled engines.
#   arxiv / semantic scholar ... already enabled; kept on explicitly, along with
#                                google scholar, for the academic path.
#   yahoo "finance" ............ the engine is `yahoo` (general web). SearXNG has
#                                no Yahoo Finance engine; live quote data comes
#                                from yfinance in search/quick_search.py.
#   reddit ..................... NO reddit engine exists in SearXNG. Reach it
#                                with a `site:reddit.com` query via google/bing.
#   10 results per engine ...... not a settings.yml option for these engines.
#                                `results_per_page` is read by only a handful
#                                (openlibrary, qwant, braveapi, marginalia,
#                                reuters, ...). google/bing/duckduckgo/brave/
#                                wikipedia/arxiv/semantic scholar/yahoo each
#                                return their own page size — measured 9-26
#                                results per query here. How many Atlas keeps is
#                                set by QUICK_SEARCH_RESULTS in core/config.py.
#   10-minute result cache ..... SearXNG has no search-result cache. searx.cache
#                                (ExpireCache) only backs favicons, weather,
#                                currency tables and tracker patterns, and the
#                                `valkey` section is for the limiter. The TTL is
#                                therefore implemented in Atlas' own client:
#                                SEARCH_CACHE_TTL_SECONDS in core/config.py.
#
# Timeout: the default `request_timeout` is 3.0s and `yahoo` was measured timing
# out at exactly 3.0s, so the 4s requested here does buy real coverage.
# =============================================================================

use_default_settings: true

server:
  # Generated by the container on first start. The apply command preserves the
  # live value instead of putting a secret in git.
  secret_key: "__SECRET_KEY__"
  image_proxy: true

search:
  # 0: none, 1: moderate, 2: strict. The instance is localhost-only and the
  # limiter is off, so no filtering is wanted.
  safe_search: 0
  # `json` is what Atlas' search client speaks; without it every request 403s.
  formats:
    - html
    - json
  # Default CAPTCHA ban is 3600s. A DuckDuckGo CAPTCHA (observed from this
  # machine) otherwise removes ddg from every query for a full hour; 600s lets
  # it rejoin sooner while the other engines cover the gap.
  suspended_times:
    SearxEngineAccessDenied: 180
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 60
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800

outgoing:
  # PHASE 18: 4 seconds per engine (up from the 3.0 default).
  request_timeout: 4.0
  # Ceiling for engines that explicitly ask for longer.
  max_request_timeout: 6.0
  useragent_suffix: ""
  # Connections to keep alive across queries.
  pool_connections: 100
  enable_http2: true

engines:
  # ---------------------------------------------------------------------------
  # Engines this build disables by default. Enabling them is the point of this
  # block: without it they are absent from every search that does not name them
  # explicitly (including the SearXNG web UI at http://localhost:8888).
  # ---------------------------------------------------------------------------
  - name: google
    engine: google
    shortcut: go
    categories: [general, web]
    disabled: false

  - name: bing
    engine: bing
    shortcut: bi
    categories: [general, web]
    disabled: false

  - name: yahoo
    engine: yahoo
    shortcut: yh
    categories: [general, web]
    disabled: false

  # ---------------------------------------------------------------------------
  # Already enabled by default; pinned explicitly so an upstream default change
  # cannot silently take them away.
  # ---------------------------------------------------------------------------
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: [general, web]
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    categories: [general, web]
    disabled: false

  - name: arxiv
    engine: arxiv
    shortcut: arx
    categories: [science, scientific publications]
    disabled: false

  - name: semantic scholar
    engine: semantic_scholar
    shortcut: se
    categories: [science, scientific publications]
    disabled: false

  - name: google scholar
    engine: google_scholar
    shortcut: gos
    categories: [science, scientific publications]
    disabled: false

  # ---------------------------------------------------------------------------
  # The wikipedia fix. The wikipedia engine defaults to
  # `display_type: ["infobox"]`, which puts its hits in the JSON `infoboxes`
  # array and NOT in `results`. Atlas reads `results`, so wikipedia returned
  # nothing for every query (measured: 0 results for every probe). Adding
  # "list" is what makes it appear at all.
  # ---------------------------------------------------------------------------
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    categories: [general]
    display_type: ["infobox", "list"]
    disabled: false
